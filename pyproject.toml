[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "calm-forge"
version = "0.5.0"
description = "CALM Architecture-as-Code → governed operational artifacts (Vault, Sentinel, Ansible, Terraform)"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["click>=8.1", "pyyaml>=6.0"]

[project.scripts]
calm-forge = "calm_forge.cli:cli"

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "PyJWT>=2.8",
    "cryptography>=42.0",
    "mcp>=1.0,<2",
]
graph = [
    "kuzu>=0.6",
    "falkordb>=1.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "PyJWT>=2.8",
    "cryptography>=42.0",
    "httpx>=0.27",
    "mcp>=1.0,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"calm_forge.opa_policies" = ["*.rego"]
"calm_forge.knowledge_graph" = ["*.json"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
